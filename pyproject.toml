[project]
name = "openpilot-perception"
version = "0.1.0"
description = "3D object perception from comma road video, with metric supervision from real sensors"
readme = "README.md"
requires-python = ">=3.12.3,<3.13"
license = {text = "MIT"}
# Everything the site (web/) and the experiments need. Reading an rlog (perception.sources.comma_log)
# needs openpilot's LogReader too, which the openpilot.distill environment provides.
dependencies = [
  "huggingface-hub",
  "numpy>=2.0",
  "opencv-python-headless",
  # Reading comma logs without openpilot (perception.sources.rlog).
  "pycapnp==2.1.0",
  "safetensors",
  "torch==2.13.0",
  "zstandard",
]

[project.optional-dependencies]
# Tesla V100 / Volta (sm_70): `uv sync --extra v100`. The default PyPI torch is built for CUDA 13, which
# dropped Volta; the cu126 builds still ship sm_70 kernels. install.sh writes PERCEPTION_UV_EXTRA=v100 in
# the .env of the clone when it finds such a GPU, and tasks/update.py syncs with it.
v100 = ["torch==2.13.0"]
# The default CUDA 13 stack. Empty: it only exists because a conflict set needs two entries.
cuda13 = []

[dependency-groups]
dev = [
  "ruff>=0.11",
]

[tool.uv]
package = false
# Without this conflict uv merges the extra-scoped source into the default resolution.
conflicts = [[{ extra = "v100" }, { extra = "cuda13" }]]

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

# Applied only with the v100 extra, on Linux.
[tool.uv.sources]
torch = [{ index = "pytorch-cu126", extra = "v100", marker = "sys_platform == 'linux'" }]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "C4", "PIE", "UP"]
