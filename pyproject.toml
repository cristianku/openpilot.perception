[project]
name = "openpilot-perception"
version = "0.1.0"
description = "3D object perception from comma road video, with metric supervision from real sensors"
readme = "README.md"
requires-python = ">=3.12.3,<3.13"
license = {text = "MIT"}
dependencies = [
  "numpy>=2.0",
  "torch",
]

[project.optional-dependencies]
# Drawing the objects on a frame (perception.viz.draw).
viz = ["opencv-python-headless"]
# The geometry audit (perception.audit.geometry_audit); it also needs ffmpeg on the PATH.
audit = ["opencv-python-headless", "safetensors"]
# The frozen monocular baseline (perception.experiments.mono_baseline): weights from Hugging Face.
baseline = ["opencv-python-headless", "safetensors", "huggingface-hub"]

[dependency-groups]
dev = [
  "ruff>=0.11",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "C4", "PIE", "UP"]
